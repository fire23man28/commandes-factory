name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compile, lance les tests unitaires et d'intégration (Testcontainers utilise Docker, présent sur ubuntu-latest)
      - name: Build et tests
        run: mvn -B verify
